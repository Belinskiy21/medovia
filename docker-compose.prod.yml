services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meditrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meditrack}
      POSTGRES_DB: ${POSTGRES_DB:-meditrack_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meditrack} -d ${POSTGRES_DB:-meditrack_production}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-meditrack-backend:local}
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
      DATABASE_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-meditrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meditrack}
      POSTGRES_DB: ${POSTGRES_DB:-meditrack_production}
      POSTGRES_CACHE_DB: ${POSTGRES_CACHE_DB:-meditrack_production_cache}
      POSTGRES_QUEUE_DB: ${POSTGRES_QUEUE_DB:-meditrack_production_queue}
      POSTGRES_CABLE_DB: ${POSTGRES_CABLE_DB:-meditrack_production_cable}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-local-production-secret-key-base-change-me}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
    ports:
      - "${BACKEND_PORT:-3001}:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    image: ${FRONTEND_IMAGE:-meditrack-frontend:local}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
