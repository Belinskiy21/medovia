name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

env:
  FRONTEND_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://example.com/api/v1' }}

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push production images
        id: images
        run: |
          set -euo pipefail
          image_namespace="ghcr.io/${GITHUB_REPOSITORY,,}"
          backend_image="${image_namespace}/backend:${GITHUB_SHA}"
          frontend_image="${image_namespace}/frontend:${GITHUB_SHA}"

          docker build -t "$backend_image" -t "${image_namespace}/backend:latest" ./backend
          docker build \
            -f frontend/Dockerfile.prod \
            --build-arg VITE_API_BASE_URL="${FRONTEND_API_BASE_URL}" \
            -t "$frontend_image" \
            -t "${image_namespace}/frontend:latest" \
            ./frontend

          docker push "$backend_image"
          docker push "${image_namespace}/backend:latest"
          docker push "$frontend_image"
          docker push "${image_namespace}/frontend:latest"

          echo "backend_image=$backend_image" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$frontend_image" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload deployment files
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "mkdir -p '${{ secrets.DEPLOY_PATH }}'/scripts"
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/docker-compose.prod.yml"
          scp -i ~/.ssh/deploy_key scripts/deploy.sh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/scripts/deploy.sh"

      - name: Run deployment
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && \
             chmod +x scripts/deploy.sh && \
             APP_DIR='${{ secrets.DEPLOY_PATH }}' \
             BACKEND_IMAGE='${{ needs.build-and-push.outputs.backend_image }}' \
             FRONTEND_IMAGE='${{ needs.build-and-push.outputs.frontend_image }}' \
             GHCR_USERNAME='${{ github.actor }}' \
             GHCR_TOKEN='${{ github.token }}' \
             scripts/deploy.sh"
